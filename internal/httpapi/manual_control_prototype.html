<!doctype html>
<!--
  PROTOTYPE — throw away after the interaction decision is captured.
  Question: Which responsive interaction makes transactional manual control clearest?
  Three variants of the existing dashboard controls, switchable via ?variant=A|B|C.
  Run: python3 -m http.server 8091 --directory internal/httpapi
  Open: http://127.0.0.1:8091/manual_control_prototype.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pooly — Manual control prototype</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f7f8;
  --panel: #fff;
  --text: #172126;
  --muted: #5d6b73;
  --line: #d8e1e5;
  --accent: #007c89;
  --accent-strong: #005e67;
  --soft: #eef6f8;
  --ok: #1d7f45;
  --warn: #a45f00;
  --bad: #b42318;
  --manual: #fff6e8;
  --manual-line: #efc27d;
  --shadow: 0 14px 34px rgba(23,33,38,.09);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select { font: inherit; }
button {
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 12px;
  background: #fff;
  color: var(--text);
  font-weight: 750;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: rgba(0,124,137,.5); }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid rgba(0,124,137,.22);
  outline-offset: 2px;
}
button:disabled { cursor: not-allowed; opacity: .48; }
button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
button.danger { border-color: #f0b8b3; color: var(--bad); }
button.ghost { background: transparent; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
.app { width: min(1080px, 100%); margin: 0 auto; padding: 14px 14px 150px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 21px; }
.muted { color: var(--muted); }
.tiny { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 12px; }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--panel); box-shadow: var(--shadow); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.status-hero { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.temp { font-size: 52px; line-height: 1; font-weight: 850; }
.badge { display: inline-flex; align-items: center; min-height: 28px; padding: 4px 9px; border-radius: 999px; background: #edf4f6; color: var(--muted); font-weight: 800; font-size: 12px; }
.badge.ok { background: #e8f5ee; color: var(--ok); }
.badge.warn { background: #fff3df; color: var(--warn); }
.badge.bad { background: #fdeceb; color: var(--bad); }
.mode-tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 11px; background: #edf2f4; }
.mode-tabs button { border: 0; background: transparent; }
.mode-tabs button.selected { background: #fff; color: var(--accent-strong); box-shadow: 0 3px 9px rgba(23,33,38,.12); }
.mode-tabs button.selected.manual { background: var(--manual); color: #7a4500; }
.notice { display: flex; align-items: flex-start; gap: 9px; margin: 12px 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: #f8fbfc; }
.notice.manual { border-color: var(--manual-line); background: var(--manual); }
.notice.bad { border-color: #efb1ab; background: #fff0ef; }
.notice strong, .notice span { display: block; }
.notice-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.notice-actions button { min-height: 38px; }
.feature-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.feature {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  min-height: 50px; padding: 7px 8px; text-align: left;
}
.feature.on { border-color: rgba(0,124,137,.45); background: #e9f6f7; color: var(--accent-strong); }
.feature.changed { box-shadow: inset 0 0 0 2px var(--manual-line); }
.feature-main { display: flex; align-items: center; gap: 7px; min-width: 0; }
.feature strong { display: block; font-size: 13px; line-height: 1.15; }
.feature small { display: block; color: var(--muted); font-size: 11px; font-weight: 650; line-height: 1.15; margin-top: 2px; }
.cap-icon {
  display: grid; place-items: center; width: 25px; height: 25px; flex: 0 0 auto;
  border-radius: 7px; background: #edf2f4; color: #64737a;
}
.cap-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.feature.on .cap-icon { background: var(--accent); color: #fff; }
.dot { width: 11px; height: 11px; flex: 0 0 auto; border-radius: 50%; background: #a7b2b8; }
.on .dot { background: var(--accent); }
.icon-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
.icon-control {
  position: relative; display: grid; place-items: center; min-width: 0; min-height: 52px;
  padding: 6px; aspect-ratio: 1; border-radius: 12px;
}
.icon-control .cap-icon { width: 31px; height: 31px; border-radius: 9px; }
.icon-control .cap-icon svg { width: 20px; height: 20px; }
.icon-control .dot {
  position: absolute; right: 5px; bottom: 5px; width: 7px; height: 7px;
  border: 1px solid #fff;
}
.icon-control.on { border-color: rgba(0,124,137,.45); background: #e9f6f7; }
.icon-control.changed { box-shadow: inset 0 0 0 2px var(--manual-line); }
.dependency-controls {
  display: grid; grid-template-columns: minmax(64px,.8fr) 1fr 1fr; gap: 9px;
  padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #f8fbfc;
}
.dependency-master { display: grid; align-content: center; justify-items: center; border-right: 1px solid var(--line); padding-right: 9px; }
.dependency-master .icon-control { width: min(72px,100%); }
.dependency-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-content: center; }
.dependency-stack + .dependency-stack { padding-left: 9px; border-left: 1px solid var(--line); }
.control-orbit {
  position: relative; width: min(300px,100%); height: 214px; margin: 0 auto;
  border: 1px solid var(--line); border-radius: 50%; background: radial-gradient(circle, #fff 0 34%, #edf6f8 35% 36%, #f8fbfc 37%);
}
.control-orbit .icon-control { position: absolute; width: 54px; min-height: 54px; }
.orbit-power { left: 50%; top: 50%; width: 62px !important; min-height: 62px !important; transform: translate(-50%,-50%); }
.orbit-filter { left: 50%; top: 7px; transform: translateX(-50%); }
.orbit-heater { right: 26px; top: 50%; transform: translateY(-50%); }
.orbit-jets { left: 50%; bottom: 7px; transform: translateX(-50%); }
.orbit-bubbles { left: 26px; top: 50%; transform: translateY(-50%); }
.target-row { display: grid; grid-template-columns: 1fr 120px; align-items: end; gap: 10px; margin-top: 12px; }
label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
input, select {
  min-height: 44px; width: 100%; border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; background: #fff; color: var(--text); font-size: 16px;
}
.duration { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.duration button.selected { border-color: var(--accent); background: var(--soft); color: var(--accent-strong); }
.draft-bar {
  position: sticky; bottom: 78px; z-index: 3; display: grid; grid-template-columns: 1fr auto;
  gap: 12px; align-items: center; margin-top: 12px; padding: 12px; border: 1px solid var(--manual-line);
  border-radius: 11px; background: rgba(255,246,232,.96); box-shadow: 0 12px 30px rgba(86,51,0,.14);
}
.draft-actions { display: flex; gap: 8px; }
.changes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.chip { padding: 4px 8px; border-radius: 999px; background: #fff; border: 1px solid #e6c995; font-size: 12px; font-weight: 750; }
.section { margin-top: 14px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.session-card { border: 1px solid var(--manual-line); border-radius: 10px; padding: 12px; background: var(--manual); }
.session-card .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.debug {
  margin-top: 12px; border: 1px dashed #adbbc1; border-radius: 9px; padding: 9px;
  background: #f8fbfc; color: #425158; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap;
}

/* Variant B — a guided composer instead of a control panel. */
.wizard-shell { display: grid; grid-template-columns: 230px 1fr; min-height: 520px; padding: 0; overflow: hidden; }
.wizard-rail { padding: 18px; background: #123f45; color: #fff; }
.wizard-rail ol { list-style: none; display: grid; gap: 18px; margin: 22px 0 0; padding: 0; }
.wizard-rail li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; opacity: .55; }
.wizard-rail li.current, .wizard-rail li.done { opacity: 1; }
.step-number { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid rgba(255,255,255,.5); border-radius: 50%; font-weight: 850; }
.done .step-number { background: #fff; color: #123f45; }
.wizard-main { display: grid; grid-template-rows: auto 1fr auto; padding: 20px; }
.wizard-main .feature-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
.wizard-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.big-choice { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.big-choice button { min-height: 76px; text-align: left; }
.big-choice button.selected { border-color: var(--accent); background: var(--soft); }
.review-list { display: grid; gap: 8px; }
.review-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }

/* Variant C — current versus proposed, diff-first. */
.split-head { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.split-head > div { padding: 10px; border-radius: 9px; background: #f5f8f9; }
.split-head > div:last-child { background: var(--manual); }
.ledger { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ledger-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; align-items: center; min-height: 56px; border-top: 1px solid var(--line); }
.ledger-row:first-child { border-top: 0; }
.ledger-row > * { padding: 9px 11px; }
.ledger-row > * + * { border-left: 1px solid var(--line); }
.ledger button { width: 100%; }
.ledger .proposed { background: #fffaf1; }
.ledger .changed { background: #fff1d8; }
.state-value { display: flex; align-items: center; gap: 7px; font-weight: 750; }
.ledger-actions { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; margin-top: 12px; }

.prototype-switcher {
  position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 20;
  transform: translateX(-50%); display: flex; align-items: center; gap: 7px;
  width: min(720px, calc(100% - 20px)); padding: 7px; border-radius: 14px;
  background: #101719; color: #fff; box-shadow: 0 15px 45px rgba(0,0,0,.3);
}
.prototype-switcher button { min-width: 44px; border-color: #364247; background: #202a2e; color: #fff; }
.prototype-label { flex: 1; min-width: 0; text-align: center; font-weight: 800; }
.prototype-switcher select { width: 195px; min-height: 44px; border-color: #364247; background: #202a2e; color: #fff; }

@media (max-width: 720px) {
  .app { padding: 10px 10px 170px; }
  .topbar .muted { display: none; }
  .grid { grid-template-columns: 1fr; }
  .status-panel { display: none; }
  .feature-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .feature { min-height: 48px; padding: 6px 7px; }
  .icon-grid { gap: 5px; }
  .icon-control { min-height: 50px; border-radius: 10px; }
  .dependency-controls { grid-template-columns: 58px 1fr 1fr; gap: 7px; padding: 8px; }
  .dependency-master { padding-right: 7px; }
  .dependency-stack { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 5px; }
  .dependency-stack + .dependency-stack { padding-left: 7px; }
  .duration { grid-template-columns: repeat(2, 1fr); }
  .draft-bar { position: relative; bottom: auto; grid-template-columns: 1fr; }
  .draft-actions { display: grid; grid-template-columns: 1fr 2fr; }
  .wizard-shell { grid-template-columns: 1fr; min-height: 610px; }
  .wizard-rail { padding: 12px; }
  .wizard-rail ol { grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 12px; }
  .wizard-rail li { grid-template-columns: 24px 1fr; gap: 5px; font-size: 12px; }
  .step-number { width: 24px; height: 24px; }
  .wizard-main { padding: 14px; }
  .ledger-row { grid-template-columns: .85fr 1fr 1fr; }
  .ledger-row > * { padding: 8px 7px; }
  .ledger-actions { grid-template-columns: 1fr; }
  .prototype-switcher { flex-wrap: wrap; }
  .prototype-label { order: -1; flex-basis: calc(100% - 102px); }
  .prototype-switcher select { flex: 1; width: auto; }
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">≈</div>
      <div><h1>Pooly</h1><p class="muted">Manual control prototype · no server calls</p></div>
    </div>
    <span class="badge ok" id="connectionBadge">Connected</span>
  </header>
  <div id="prototype"></div>
</main>

<nav class="prototype-switcher" aria-label="Prototype controls">
  <button id="previousVariant" aria-label="Previous variant">←</button>
  <div class="prototype-label" id="variantLabel"></div>
  <button id="nextVariant" aria-label="Next variant">→</button>
  <select id="scenarioSelect" aria-label="Prototype scenario"></select>
</nav>

<script>
var variants = [
  {key: "A", name: "Equal icon grid"},
  {key: "B", name: "Dependency groups"},
  {key: "C", name: "Pool control ring"}
];
var scenarios = [
  ["automatic", "Automatic"],
  ["draft", "Untouched manual draft"],
  ["dirty", "Dirty manual draft"],
  ["active", "Active manual session"],
  ["editing", "Editing active session"],
  ["submitting", "Submitting"],
  ["expired", "Just expired"],
  ["failure", "Partial command failure"],
  ["offline", "Offline / stale status"]
];
var caps = ["power", "filter", "heater", "jets", "bubbles"];
var labels = {power:"Power", filter:"Filter", heater:"Heater", jets:"Jets", bubbles:"Bubbles"};
var capIcons = {
  power:'<svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M6.3 5.8a8 8 0 1 0 11.4 0"/></svg>',
  filter:'<svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>',
  heater:'<svg viewBox="0 0 24 24"><path d="M7 20c3-3-3-5 0-8s-1-4 0-8"/><path d="M12 20c3-3-3-5 0-8s-1-4 0-8"/><path d="M17 20c3-3-3-5 0-8s-1-4 0-8"/></svg>',
  jets:'<svg viewBox="0 0 24 24"><path d="M3 7h11c3 0 3-4 0-4"/><path d="M3 12h16c3 0 3-4 0-4"/><path d="M3 17h10c3 0 3 4 0 4"/></svg>',
  bubbles:'<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><circle cx="16.5" cy="8" r="3"/><circle cx="17" cy="17" r="2"/></svg>'
};
var observed = {power:true, filter:true, heater:false, jets:false, bubbles:false, target_temp:36};
var state;

function scenarioState(name) {
  var base = {
    scenario: name, phase: "automatic", online: true, stale: false, step: 1,
    duration: 60, draft: {}, active: null, submitting: false, justExpired: false, failure: null
  };
  if (name === "draft") base.phase = "draft";
  if (name === "dirty") {
    base.phase = "draft";
    base.draft = {jets:true, power:true};
  }
  if (name === "active") {
    base.phase = "active";
    base.active = {settings:{jets:true, power:true}, duration:60, remaining:"43 min"};
  }
  if (name === "editing") {
    base.phase = "editing";
    base.active = {settings:{jets:true, power:true}, duration:60, remaining:"43 min"};
    base.draft = {jets:false, filter:true};
  }
  if (name === "submitting") {
    base.phase = "draft"; base.submitting = true; base.draft = {heater:true, filter:true, power:true}; base.duration = 120;
  }
  if (name === "expired") { base.justExpired = true; }
  if (name === "failure") {
    base.phase = "active";
    base.active = {settings:{heater:true, filter:true, power:true}, duration:60, remaining:"58 min"};
    base.failure = {confirmed:["Power on", "Filter on"], failed:["Heater on"]};
  }
  if (name === "offline") { base.phase = "automatic"; base.online = false; base.stale = true; }
  return base;
}

function readParams() {
  var params = new URLSearchParams(location.search);
  var key = params.get("variant") || "A";
  var scenario = params.get("scenario") || "automatic";
  if (!variants.some(function(v){ return v.key === key; })) key = "A";
  if (!scenarios.some(function(s){ return s[0] === scenario; })) scenario = "automatic";
  return {variant:key, scenario:scenario};
}

function setParams(next) {
  var params = new URLSearchParams(location.search);
  Object.keys(next).forEach(function(key){ params.set(key, next[key]); });
  history.replaceState(null, "", location.pathname + "?" + params.toString());
}

function effectiveValue(cap) {
  if (Object.prototype.hasOwnProperty.call(state.draft, cap)) return state.draft[cap];
  if (state.active && Object.prototype.hasOwnProperty.call(state.active.settings, cap)) return state.active.settings[cap];
  return observed[cap];
}

function stage(cap, value) {
  if (state.phase === "automatic" || state.submitting || !state.online) return;
  state.draft[cap] = value;
  if (cap !== "power" && value) state.draft.power = true;
  if (cap === "heater" && value) state.draft.filter = true;
  if (cap === "power" && !value) {
    state.draft = {power:false, filter:false, heater:false, jets:false, bubbles:false};
  }
  if (cap === "filter" && !value) state.draft.heater = false;
  if (state.phase === "active") state.phase = "editing";
  render();
}

function startDraft() {
  if (!state.online) return;
  state.phase = "draft"; state.draft = {}; state.failure = null; render();
}

function returnAutomatic() {
  if (Object.keys(state.draft).length && !confirm("Discard the unsubmitted manual session draft and return to Automatic control?")) return;
  state = scenarioState("automatic"); render();
}

function applyDraft() {
  if (!Object.keys(state.draft).length || state.submitting || !state.online) return;
  state.submitting = true; render();
  setTimeout(function(){
    state.active = {settings:Object.assign({}, state.draft), duration:state.duration, remaining:state.duration ? state.duration + " min" : "Until turned off"};
    state.draft = {}; state.phase = "active"; state.submitting = false; state.scenario = "active"; render();
  }, 700);
}

function changeSummary() {
  return Object.keys(state.draft).map(function(key){
    if (key === "target_temp") return "Target " + state.draft[key] + "°";
    return labels[key] + " " + (state.draft[key] ? "on" : "off");
  });
}

function featureButtons() {
  return '<div class="feature-grid">' + caps.map(function(cap){
    var on = !!effectiveValue(cap);
    var changed = Object.prototype.hasOwnProperty.call(state.draft, cap);
    var disabled = state.phase === "automatic" || state.submitting || !state.online;
    return '<button class="feature '+(on?'on ':'')+(changed?'changed':'')+'" data-cap="'+cap+'" '+(disabled?'disabled':'')+'>'+
      '<span class="feature-main"><span class="cap-icon" aria-hidden="true">'+capIcons[cap]+'</span><span><strong>'+labels[cap]+'</strong><small>'+(on?'On':'Off')+'</small></span></span><i class="dot"></i></button>';
  }).join("") + '</div>';
}

function iconControl(cap, extraClass) {
  var on = !!effectiveValue(cap);
  var changed = Object.prototype.hasOwnProperty.call(state.draft, cap);
  var disabled = state.phase === "automatic" || state.submitting || !state.online;
  return '<button class="icon-control '+(extraClass||"")+' '+(on?'on ':'')+(changed?'changed':'')+'" data-cap="'+cap+'" '+
    'aria-label="'+labels[cap]+' '+(on?'on':'off')+'" title="'+labels[cap]+' · '+(on?'On':'Off')+'" '+(disabled?'disabled':'')+'>'+
    '<span class="cap-icon" aria-hidden="true">'+capIcons[cap]+'</span><i class="dot"></i></button>';
}

function iconGridControls() {
  return '<div class="icon-grid">'+caps.map(function(cap){ return iconControl(cap, ""); }).join("")+'</div>';
}

function dependencyControls() {
  return '<div class="dependency-controls">'+
    '<div class="dependency-master">'+iconControl("power", "")+'</div>'+
    '<div class="dependency-stack">'+iconControl("filter", "")+iconControl("heater", "")+'</div>'+
    '<div class="dependency-stack">'+iconControl("jets", "")+iconControl("bubbles", "")+'</div>'+
    '</div>';
}

function orbitControls() {
  return '<div class="control-orbit">'+
    iconControl("power", "orbit-power")+iconControl("filter", "orbit-filter")+iconControl("heater", "orbit-heater")+
    iconControl("jets", "orbit-jets")+iconControl("bubbles", "orbit-bubbles")+'</div>';
}

function durationButtons() {
  return '<div class="duration">' + [[30,"30 min"],[60,"60 min"],[120,"2 hours"],[0,"Until off"]].map(function(item){
    return '<button data-duration="'+item[0]+'" class="'+(state.duration===item[0]?'selected':'')+'" '+(state.submitting?'disabled':'')+'>'+item[1]+'</button>';
  }).join("") + '</div>';
}

function notices() {
  var html = "";
  if (!state.online) html += '<div class="notice bad"><span>●</span><div><strong>Pool is offline</strong><span>Status is 18 minutes old. Manual setup is unavailable until a fresh observation arrives.</span></div></div>';
  if (state.justExpired) html += '<div class="notice"><span>✓</span><div><strong>Manual session ended</strong><span>Automatic control resumed and the current schedule is being reconciled.</span></div></div>';
  if (state.failure) html += '<div class="notice bad"><span>!</span><div><strong>Heater could not be confirmed</strong><span>Manual remains active. Power and Filter were confirmed.</span>'+
    '<div class="notice-actions"><button data-action="retry">Retry Heater</button><button class="danger" data-action="automatic">Return to Automatic</button></div></div></div>';
  return html;
}

function modeTabs() {
  var manualSelected = state.phase !== "automatic";
  return '<div class="mode-tabs"><button data-mode="automatic" class="'+(!manualSelected?'selected':'')+'">Automatic</button>'+
    '<button data-mode="manual" class="'+(manualSelected?'selected manual':'')+'" '+(!state.online?'disabled':'')+'>Manual</button></div>';
}

function activeCard() {
  if (!state.active) return "";
  var settings = Object.keys(state.active.settings).map(function(key){
    return key === "target_temp" ? "Target "+state.active.settings[key]+"°" : labels[key]+" "+(state.active.settings[key]?"on":"off");
  });
  return '<div class="session-card section"><div class="row"><div><strong>Manual session active</strong><p class="muted">'+settings.join(" · ")+'</p></div><span class="badge warn">'+state.active.remaining+'</span></div></div>';
}

function reviewTray() {
  if (state.phase === "automatic") return "";
  var changes = changeSummary();
  return '<div class="draft-bar"><div><strong>'+(changes.length ? changes.length+" change"+(changes.length>1?"s":"") : "Choose settings for this session")+'</strong>'+
    '<div class="changes">'+(changes.length?changes.map(function(c){return '<span class="chip">'+c+'</span>';}).join(""):'<span class="tiny">Nothing is sent until Apply.</span>')+'</div></div>'+
    '<div class="draft-actions"><button data-action="cancel">Cancel</button><button class="primary" data-action="apply" '+(!changes.length||state.submitting?'disabled':'')+'>'+(state.submitting?'Applying…':'Apply manual session')+'</button></div></div>';
}

function renderIconVariant(controls, targetID, variantHint) {
  return '<div class="grid"><section class="panel status-panel"><div class="panel-head"><h2>Status</h2><span class="badge '+(state.online?'ok':'bad')+'">'+(state.online?'Live':'Stale')+'</span></div>'+
    '<div class="status-hero"><div><div class="temp">34°</div><p class="muted">Target 36°</p></div><span class="badge">Heating</span></div>'+
    '<div class="section"><p class="tiny">Next automatic action</p><strong>Ready at 18:00 · heater scheduled</strong></div></section>'+
    '<section class="panel"><div class="panel-head"><div><h2>Controls</h2><p class="tiny">Live state remains visible in Automatic</p></div></div>'+
    modeTabs()+notices()+activeCard()+'<div class="section"><div class="section-title"><h3>Features</h3><span class="tiny">'+variantHint+'</span></div>'+controls+'</div>'+
    '<div class="target-row"><label>Target temperature<input id="'+targetID+'" type="number" min="10" max="40" value="'+effectiveValue("target_temp")+'" '+(state.phase==="automatic"||!state.online?'disabled':'')+'></label><span class="badge">Observed '+observed.target_temp+'°</span></div>'+
    '<div class="section"><div class="section-title"><h3>Duration</h3><span class="tiny">Restarts when changes are applied</span></div>'+durationButtons()+'</div>'+
    reviewTray()+'</section></div>';
}

function renderA() {
  return renderIconVariant(iconGridControls(), "targetA", state.phase === "automatic" ? "Choose Manual to edit" : "Equal priority");
}

function renderB() {
  return renderIconVariant(dependencyControls(), "targetB", state.phase === "automatic" ? "Choose Manual to edit" : "Dependencies grouped");
}

function renderC() {
  return renderIconVariant(orbitControls(), "targetC", state.phase === "automatic" ? "Choose Manual to edit" : "Pool-centered");
}

function debugState() {
  return '<details class="debug"><summary>Prototype state</summary>'+JSON.stringify({
    phase:state.phase, observed:observed, draft:state.draft, duration_minutes:state.duration,
    active_session:state.active, online:state.online, stale:state.stale, submitting:state.submitting, failure:state.failure
  }, null, 2)+'</details>';
}

function bind() {
  document.querySelectorAll("[data-mode]").forEach(function(button){
    button.onclick = function(){ button.dataset.mode === "manual" ? startDraft() : returnAutomatic(); };
  });
  document.querySelectorAll("[data-cap]").forEach(function(button){
    button.onclick = function(){ stage(button.dataset.cap, !effectiveValue(button.dataset.cap)); };
  });
  document.querySelectorAll("[data-duration]").forEach(function(button){
    button.onclick = function(){ state.duration = Number(button.dataset.duration); render(); };
  });
  document.querySelectorAll('[data-action="apply"]').forEach(function(button){ button.onclick = applyDraft; });
  document.querySelectorAll('[data-action="cancel"]').forEach(function(button){ button.onclick = returnAutomatic; });
  document.querySelectorAll('[data-action="automatic"]').forEach(function(button){ button.onclick = returnAutomatic; });
  document.querySelectorAll('[data-action="retry"]').forEach(function(button){
    button.onclick = function(){
      state.failure = null;
      state.active.settings.heater = true;
      state.active.remaining = "57 min";
      render();
    };
  });
  document.querySelectorAll('[data-action="next"]').forEach(function(button){ button.onclick = function(){ state.step = Math.min(3,state.step+1); render(); }; });
  document.querySelectorAll('[data-action="back"]').forEach(function(button){ button.onclick = function(){ state.step = Math.max(1,state.step-1); render(); }; });
  ["targetA","targetB","targetC"].forEach(function(id){
    var input = document.getElementById(id);
    if (input) input.onchange = function(){ state.draft.target_temp = Number(input.value); render(); };
  });
}

function render() {
  var params = readParams();
  var renderer = params.variant === "A" ? renderA : params.variant === "B" ? renderB : renderC;
  document.getElementById("prototype").innerHTML = renderer() + debugState();
  document.getElementById("connectionBadge").className = "badge " + (state.online ? "ok" : "bad");
  document.getElementById("connectionBadge").textContent = state.online ? "Connected" : "Offline · stale";
  document.getElementById("variantLabel").textContent = params.variant + " — " + variants.find(function(v){return v.key===params.variant;}).name;
  document.getElementById("scenarioSelect").value = params.scenario;
  bind();
}

function cycleVariant(offset) {
  var params = readParams();
  var index = variants.findIndex(function(v){return v.key===params.variant;});
  var next = variants[(index + offset + variants.length) % variants.length].key;
  setParams({variant:next}); render();
}

var scenarioSelect = document.getElementById("scenarioSelect");
scenarioSelect.innerHTML = scenarios.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>';}).join("");
scenarioSelect.onchange = function(){ setParams({scenario:scenarioSelect.value}); state=scenarioState(scenarioSelect.value); render(); };
document.getElementById("previousVariant").onclick = function(){cycleVariant(-1);};
document.getElementById("nextVariant").onclick = function(){cycleVariant(1);};
document.addEventListener("keydown", function(event){
  var tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (event.key === "ArrowLeft") cycleVariant(-1);
  if (event.key === "ArrowRight") cycleVariant(1);
});
var initial = readParams();
state = scenarioState(initial.scenario);
render();
</script>
</body>
</html>
